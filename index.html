<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ftool no Navegador</title>

    <!-- Carrega o motor Pyodide nativo (mais estável para carregar bibliotecas externas) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        #status { color: #d97706; font-weight: bold; margin-bottom: 20px; }
        #grafico { display: flex; justify-content: center; }
    </style>
</head>
<body>

    <h1>Análise Estrutural 2D (Ftool Web)</h1>
    <div id="status">⏳ Carregando Python e instalando a biblioteca anastruct... (aguarde ~10s)</div>
    
    <!-- Local onde o gráfico será exibido -->
    <div id="grafico"></div>

    <script>
        async function rodarFtool() {
            const statusDiv = document.getElementById("status");

            try {
                // 1. Inicializa o Python no navegador
                let pyodide = await loadPyodide();
                
                // 2. Baixa o instalador de pacotes (micropip)
                await pyodide.loadPackage("micropip");
                const micropip = pyodide.pyimport("micropip");
                
                // 3. Instala o anastruct e dependências direto do PyPI
                await micropip.install(['anastruct', 'matplotlib', 'scipy']);

                statusDiv.innerText = "⚡ Calculando estrutura e gerando diagrama...";

                // 4. Executa o código Python puro
                await pyodide.runPythonAsync(`
                    import io
                    import base64
                    import matplotlib.pyplot as plt
                    from anastruct import SystemElements

                    # Monta o sistema estrutural
                    ss = SystemElements()
                    ss.add_element(location=[[0, 0], [5, 0]])
                    ss.add_support_hinged(node_id=1)
                    ss.add_support_roll(node_id=2)
                    ss.point_load(node_id=2, Fy=-10)
                    ss.solve()

                    # Gera o gráfico em memória
                    fig = ss.show_bending_moment(show=False)
                    
                    # Converte a imagem do matplotlib em base64 para mostrar no HTML
                    buf = io.BytesIO()
                    fig.savefig(buf, format='png', bbox_inches='tight')
                    buf.seek(0)
                    img_str = base64.b64encode(buf.read()).decode('utf-8')
                    
                    # Salva a imagem na variável global JS
                    img_html = f'<img src="data:image/png;base64,{img_str}" />'
                `);

                // 5. Renderiza a imagem gerada pelo Python na tela
                document.getElementById("grafico").innerHTML = pyodide.globals.get('img_html');
                statusDiv.innerText = "✅ Cálculo concluído com sucesso!";
                statusDiv.style.color = "#16a34a";

            } catch (erro) {
                console.error(erro);
                statusDiv.innerText = "❌ Erro ao carregar: " + erro.message;
                statusDiv.style.color = "#dc2626";
            }
        }

        // Inicia a execução assim que a página abre
        rodarFtool();
    </script>

</body>
</html>
