<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ortogonalização de Gram-Schmidt (Fortran + Wasm)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; color: #333; }
    h1 { color: #1a365d; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
    label { font-weight: bold; }
    input[type="number"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 18px; background-color: #2b6cb0; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #2c5282; }
    table { border-collapse: collapse; margin-top: 10px; }
    td, th { border: 1px solid #cbd5e0; padding: 6px 10px; text-align: center; }
    input.cell { width: 60px; text-align: center; }
    .result-matrix { background-color: #edf2f7; font-family: monospace; }
  </style>
</head>
<body>

  <h1>Calculadora Gram-Schmidt (Fortran via WebAssembly)</h1>

  <div class="card">
    <div class="controls">
      <label>Linhas (N):</label>
      <input type="number" id="numN" value="3" min="1" max="10">

      <label>Colunas (M):</label>
      <input type="number" id="numM" value="3" min="1" max="10">

      <label>Tipo de Entrada (E):</label>
      <select id="selectE" onchange="alternarModoEntrada()">
        <option value="1">Manual (Digitar Matriz)</option>
        <option value="2">Matriz de Hilbert</option>
      </select>

      <button onclick="gerarTabela()">Gerar Tabela</button>
    </div>

    <div id="containerMatriz"></div>
    <br>
    <button onclick="executarCalculoFortran()" style="background-color: #2f855a;">Executar Ortogonalização</button>
  </div>

  <div class="card" id="cardResultado" style="display: none;">
    <h2>Matriz Ortonormalizada (Saída do Fortran):</h2>
    <div id="resultadoTabela"></div>
  </div>

  <script>
    let wasmInstance = null;

    // Carrega o binário Wasm gerado pelo Fortran
    WebAssembly.instantiateStreaming(fetch('trabalho3.wasm'))
      .then(obj => {
        wasmInstance = obj.instance;
        console.log("Módulo Fortran carregado com sucesso!");
      })
      .catch(err => console.error("Erro ao carregar Wasm:", err));

    function gerarTabela() {
      const n = parseInt(document.getElementById('numN').value);
      const m = parseInt(document.getElementById('numM').value);
      const modoE = document.getElementById('selectE').value;
      const container = document.getElementById('containerMatriz');

      let html = '<h3>Matriz de Entrada A:</h3><table>';
      for (let i = 0; i < n; i++) {
        html += '<tr>';
        for (let j = 0; j < m; j++) {
          let val = 0;
          if (modoE === '2') {
            val = (1.0 / (i + j + 1)).toFixed(4); // Matriz de Hilbert
          } else {
            val = (i === j) ? 1 : 0;
          }
          html += `<td><input type="number" step="any" class="cell" id="c_${i}_${j}" value="${val}"></td>`;
        }
        html += '</tr>';
      }
      html += '</table>';
      container.innerHTML = html;
    }

    function alternarModoEntrada() {
      gerarTabela();
    }

    function executarCalculoFortran() {
      if (!wasmInstance) {
        alert("O módulo WebAssembly ainda não foi carregado.");
        return;
      }

      const n = parseInt(document.getElementById('numN').value);
      const m = parseInt(document.getElementById('numM').value);
      const eOpt = parseInt(document.getElementById('selectE').value);

      // 1. Aloca memória no Wasm para a matriz de entrada A e saída EN
      const bytesPerDouble = 8;
      const totalElements = n * m;
      const ptrA = wasmInstance.exports.malloc(totalElements * bytesPerDouble);
      const ptrEN = wasmInstance.exports.malloc(totalElements * bytesPerDouble);

      // 2. Preenche o array da matriz A (Fortran usa ordem Column-Major / por coluna)
      const bufferA = new Float64Array(wasmInstance.exports.memory.buffer, ptrA, totalElements);
      for (let j = 0; j < m; j++) {
        for (let i = 0; i < n; i++) {
          const val = parseFloat(document.getElementById(`c_${i}_${j}`).value) || 0.0;
          bufferA[j * n + i] = val; // Índice em ordem de coluna
        }
      }

      // 3. Chama a subrotina do Fortran diretamente
      wasmInstance.exports.resolver_gramschmidt(ptrA, n, m, eOpt, ptrEN);

      // 4. Lê o resultado diretamente da memória Wasm
      const bufferEN = new Float64Array(wasmInstance.exports.memory.buffer, ptrEN, totalElements);
      
      let resHtml = '<table class="result-matrix">';
      for (let i = 0; i < n; i++) {
        resHtml += '<tr>';
        for (let j = 0; j < m; j++) {
          const val = bufferEN[j * n + i];
          resHtml += `<td>${val.toFixed(6)}</td>`;
        }
        resHtml += '</tr>';
      }
      resHtml += '</table>';

      document.getElementById('resultadoTabela').innerHTML = resHtml;
      document.getElementById('cardResultado').style.display = 'block';

      // 5. Libera a memória alocada
      wasmInstance.exports.free(ptrA);
      wasmInstance.exports.free(ptrEN);
    }

    // Inicializa a tabela padrão ao carregar
    window.onload = gerarTabela;
  </script>
</body>
</html>
