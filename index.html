<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ftool no Navegador</title>

    <!-- Carrega a biblioteca do PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>

    <h1>Análise Estrutural 2D (Ftool Web)</h1>
    <p>Aguarde alguns segundos na primeira vez para baixar a biblioteca e rodar o cálculo...</p>
    
    <!-- Local onde o gráfico será desenhado -->
    <div id="grafico-viga"></div>

    <!-- Script em Python usando top-level await com micropip -->
    <script type="py">
        import micropip
        import matplotlib.pyplot as plt
        from pyscript import display

        # 1. Baixa o anastruct e o matplotlib direto para a memória do navegador
        await micropip.install(['anastruct', 'matplotlib'])

        # 2. Agora importa a biblioteca com garantia de que ela existe
        from anastruct import SystemElements

        # 3. Cria o sistema estrutural
        ss = SystemElements()

        # 4. Adiciona uma barra de 5 metros (de x=0 a x=5)
        ss.add_element(location=[[0, 0], [5, 0]])

        # 5. Adiciona os apoios (Nó 1 = Engaste/Fixo, Nó 2 = Rolete)
        ss.add_support_hinged(node_id=1)
        ss.add_support_roll(node_id=2)

        # 6. Aplica uma carga de 10 kN para baixo no meio da viga (Nó 2)
        ss.point_load(node_id=2, Fy=-10)

        # 7. Resolve as equações da estrutura
        ss.solve()

        # 8. Gera o diagrama de Momento Fletor
        fig = ss.show_bending_moment(show=False)

        # 9. Exibe o gráfico na div HTML
        display(fig, target="grafico-viga")
    </script>

</body>
</html>
